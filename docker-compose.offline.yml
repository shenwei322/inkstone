# InkStone 一键离线部署编排（离线镜像方式）。
# 用法：docker load -i inkstone-images.tar 后，
#       cd <部署目录> && docker compose --env-file .env -f docker-compose.offline.yml up -d
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: blog-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-blog_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blog} -d ${DB_NAME:-blog_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: inkstone-backend:latest
    container_name: blog-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-blog_platform}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://blog.shenv.top}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://blog.shenv.top}
      # 离线镜像部署默认关闭在线更新：镜像不含源码树，替换源码后也无法在服务器上重建。
      # 需要在线更新时：把源码目录挂到 /app/src、把本项设为 true，
      # 并在宿主机上运行 deploy/update-agent.sh 完成重建（详见 .ai-skill/references/deployment.md）。
      # 镜像包更新（UPDATE_SOURCE=releases）不需要源码树：下载 Release 镜像包 →
      # 宿主代理 docker load + compose up -d 即可生效。
      UPDATE_ENABLED: ${UPDATE_ENABLED:-false}
      # commits（默认，源码包替换）/ releases（GitHub Releases 镜像包）
      UPDATE_SOURCE: ${UPDATE_SOURCE:-commits}
      UPDATE_SOURCE_DIR: ${UPDATE_SOURCE_DIR:-/app/src}
      UPDATE_REPO_URL: ${UPDATE_REPO_URL:-https://github.com/shenwei234/inkstone}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      UPDATE_MIRROR: ${UPDATE_MIRROR:-https://gh-proxy.com/https://github.com/{owner}/{name}/archive/{commit}.tar.gz}
      UPDATE_WAITING_AGENT: ${UPDATE_WAITING_AGENT:-true}
      # releases 模式：镜像包资产名匹配 / 大小上限 / 安装用 compose 文件 / 部署版本记录
      UPDATE_IMAGE_ASSET: ${UPDATE_IMAGE_ASSET:-}
      UPDATE_IMAGE_MAX_MB: ${UPDATE_IMAGE_MAX_MB:-2048}
      UPDATE_COMPOSE_FILE: ${UPDATE_COMPOSE_FILE:-}
      UPDATE_VERSION_FILE: ${UPDATE_VERSION_FILE:-}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
    volumes:
      - uploads_data:/app/data
      # 可选：在线更新需要访问宿主源码树时启用（默认注释，保持离线镜像最小依赖）
      # - ./:/app/src
    # 最小权限：Go 静态服务无需任何 capability；被 RCE 时降低影响面
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    image: inkstone-frontend:latest
    container_name: blog-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
