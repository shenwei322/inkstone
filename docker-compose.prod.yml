# InkStone 生产编排（源码构建方式）。
# 离线镜像方式：把 backend 的 build 换成 `image: inkstone-backend:latest`、frontend 同理即可。
# 启动：cp .env.example .env && 填好 → docker compose --env-file .env -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: blog-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-blog_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blog} -d ${DB_NAME:-blog_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: blog-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-blog_platform}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://blog.shenv.top}
      ADMIN_URL: ${ADMIN_URL:-https://admin.blog.shenv.top}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://blog.shenv.top}
      # 可信反代网段：只有这些来源的 X-Forwarded-For 会被采信。
      # 留空用内置默认（本机 + 私网），覆盖同 compose 网络的 Nginx 反代。
      # 反代走公网 IP 连过来时必须显式指定，否则 IP 限流会把所有访客
      # 算成同一个人；写 none 表示完全不信任代理。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # —— 在线更新（后台 → 系统更新）——
      # 后端下载并替换源码；重建由宿主更新代理完成：
      #   deploy/update-agent.sh（Linux） / deploy/update-agent.ps1（Windows）
      UPDATE_ENABLED: ${UPDATE_ENABLED:-true}
      UPDATE_REPO_URL: ${UPDATE_REPO_URL:-https://github.com/shenwei234/inkstone}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      # commits（默认，源码包替换源码）/ releases（GitHub Releases 镜像包，docker load 安装）
      UPDATE_SOURCE: ${UPDATE_SOURCE:-commits}
      UPDATE_MIRROR: ${UPDATE_MIRROR:-https://gh-proxy.com/https://github.com/{owner}/{name}/archive/{commit}.tar.gz}
      UPDATE_GITHUB_API: ${UPDATE_GITHUB_API:-https://api.github.com}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      UPDATE_LATEST_API: ${UPDATE_LATEST_API:-}
      UPDATE_COMMITS_API: ${UPDATE_COMMITS_API:-}
      UPDATE_COMPARE_API: ${UPDATE_COMPARE_API:-}
      # releases 模式：Release 接口 / 镜像包资产名匹配 / 大小上限 / 安装用 compose / 部署版本记录
      UPDATE_RELEASES_API: ${UPDATE_RELEASES_API:-}
      UPDATE_IMAGE_ASSET: ${UPDATE_IMAGE_ASSET:-}
      UPDATE_IMAGE_MAX_MB: ${UPDATE_IMAGE_MAX_MB:-2048}
      UPDATE_COMPOSE_FILE: ${UPDATE_COMPOSE_FILE:-}
      UPDATE_VERSION_FILE: ${UPDATE_VERSION_FILE:-}
      # 源码目录挂载点（见下方 volumes）：更新会替换这里的源码文件
      UPDATE_SOURCE_DIR: ${UPDATE_SOURCE_DIR:-/app/src}
      # 更新工作目录：必须与宿主代理轮询的目录**是同一个**
      # （见下方 ./data/update 绑定挂载；宿主侧设 INKSTONE_UPDATE_DIR=./data/update 绝对路径）
      UPDATE_DIR: ${UPDATE_DIR:-/app/data/update}
      UPDATE_WAITING_AGENT: ${UPDATE_WAITING_AGENT:-true}
    volumes:
      - uploads_data:/app/data
      # 源码目录：让后端把新版源码写入宿主的源码树，宿主代理再据此重建。
      # 不需要在线更新时可注释掉（并把 UPDATE_ENABLED 设为 false）。
      - ./:/app/src
      # 更新目录：绑定到宿主 ./data/update，宿主代理才能读到待更新清单
      # （放在命名卷里宿主拿不到路径，代理会永远等不到清单）
      - ./data/update:/app/data/update
    # 最小权限：Go 静态服务无需任何 capability；被 RCE 时降低影响面
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    healthcheck:
      # alpine 镜像自带 busybox wget；供 compose --wait / 外部探活使用
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://blog.shenv.top/api/v1}
    container_name: blog-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
